[build-system]
# synchronize with requirements-build.txt when updating build dependencies
requires = [
    "setuptools>=64.0.0,<82.0.0",
    "setuptools-scm>=10.0.0",     # write_to_source needs 10.x; setup.py imports get_version at top level
    "cmake>=3.22.0",
    "pybind11>=3.0.0",
    "torch>=2.5.1,<=2.10.0",      # use torch+cpu; make sure (torch: build version <= runtime version)
]
build-backend = "setuptools.build_meta"

[project]
name = "xlite"
dynamic = ["version"]
description = "A lightweight, effective and easy-to-extend inference runtime"
readme = "README.md"
requires-python = ">=3.9"
license = "MulanPSL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Huawei Euler OS Team" }]
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# synchronize with requirements.txt when updating dependencies
dependencies = [
    "torch>=2.5.1", # make sure (torch: build version <= runtime version)
]

[project.optional-dependencies]
# synchronize with requirements-dev.txt when updating dev dependencies
dev = [
    "setuptools>=64.0.0,<82.0.0",
    "cmake>=3.22.0",
    "numpy<2.0.0",
    "tqdm",
    "safetensors",
    "tiktoken",
    "sentencepiece",
    "protobuf",
    "transformers",
    "pyyaml>=6.0",
    "torch-npu>=2.5.1",           # make sure (torch: build version <= runtime version)
    "mypy",
    "pre-commit",
]

[project.urls]
Homepage = "https://atomgit.com/openeuler/GVirt"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = ["*.tools", "*.tools.*", "tests", "tests.*"]

[tool.setuptools.package-data]
xlite = ["py.typed", "*.pyi", "*.so", "lib/*.so", "include/xlite/*.h", "lib/cmake/xlite/*.cmake"]

# Version owned by the setuptools_scm plugin. `root` is the monorepo root;
# `write_to` is resolved against it -> <monorepo>/xlite/xlite/_version.py.
[tool.setuptools_scm]
root             = ".."
write_to         = "xlite/xlite/_version.py"
write_to_source  = true
fallback_version = "0.0.0"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Matches the rule selection used by vllm / vllm-ascend.
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ISC", # flake8-implicit-str-concat
    "SIM", # flake8-simplify
    "I",   # isort
    "G",   # flake8-logging-format
]
ignore = [
    "F403", "F405", # star imports
    "E731",         # lambda assignment
    "B905",         # zip() without strict=
    "B007",         # unused loop-control variable
    "UP032",        # f-string in format calls
    "B904",         # raise without from
    "SIM102",       # collapsible if
    "SIM108",       # ternary instead of if-else block
]

[tool.ruff.lint.per-file-ignores]
# Test scripts carry long CLI strings, URLs, and CJK messages; line length is
# not enforced there. Side-effect imports (e.g. `import torch_npu` for backend
# registration) are common in tests, so unused-import findings are off too.
# f-string logging (G004) is accepted in standalone test scripts.
# Patterns are relative to this file (the project root).
"tests/**" = ["E501", "F401", "G004"]
# Stub files mirror the C++ API signatures; pyupgrade rewrites are churn there.
"**/*.pyi" = ["UP"]

# docstring-code-format stays off (default): _C.pyi docstrings contain math
# pseudo-code (e.g. weight^T) that ruff would rewrite as Python operators.

[tool.codespell]
skip = ".git,build,.mypy_cache,.pytest_cache,*.json"
# AscendC/CCE kernel vocabulary and API parameter names.
ignore-words-list = "clen,inout,outWeights,vor,rIn,biasIn,inH,unparseable,CANN,cann,CopyIn,EnQue,ND,nd,espace"

[tool.mypy]
mypy_path = "."
follow_imports = "silent"
ignore_missing_imports = true
